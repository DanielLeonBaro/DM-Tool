<!DOCTYPE html>
<html lang="es">
   <head>
      <meta charset="UTF-8">
      <title>DMT | Tracker</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <script>
         tailwind.config = {
           theme: {
             extend: {
               colors: {
                 gold: '#d4af37'
               }
             }
           }
         }
      </script>
      <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet" />
      <style>
         .party-primary {
         background-color: #2563eb;
         color: white;
         padding: 4px 12px;
         border-radius: 6px;
         font-size: 0.875rem;
         font-weight: 600;
         transition: background-color 0.15s ease;
         }
         .party-primary:hover {
         background-color: #1d4ed8;
         }
         [contenteditable][data-placeholder]:empty::before {
         content: attr(data-placeholder);
         color: #6b7280;
         pointer-events: none;
         }
         [contenteditable]:focus {
         outline: none;
         background-color: rgba(255,255,255,0.03);
         }
         [contenteditable] {
         cursor: text;
         line-height: 1.4;
         }
         [contenteditable]:hover {
         background-color: rgba(255,255,255,0.02);
         }
      </style>
   </head>
   <body class="bg-neutral-900 text-neutral-100 min-h-screen">
      <div id="navbar"></div>
      <header class="border-b border-neutral-700 p-4 flex items-center justify-between">
         <h1 class="text-2xl font-bold text-gold">⚔️ DMT | Tracker</h1>
      </header>
      <main class="p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
         <!-- ========================= -->
         <!-- TABLA DE INICIATIVA -->
         <!-- ========================= -->
         <section class="bg-gray-800 p-4 rounded-xl">
            <h2 class="text-lg font-bold mb-2">Initiative</h2>
            <div class="flex gap-2">
               <button onclick="addInitiativeRow()" type="button" 
                  class="text-white bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700 hover:bg-gradient-to-br focus:ring-4 
                  focus:outline-none focus:ring-blue-300 dark:focus:ring-blue-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               🡇 Fila
               </button>
               <button onclick="sendToTracker()" type="button" 
                  class="text-white bg-gradient-to-r from-purple-500 via-purple-600 to-purple-700 hover:bg-gradient-to-br focus:ring-4 
                  focus:outline-none focus:ring-purple-300 dark:focus:ring-purple-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               Tracker 🡆
               </button>
            </div>
            <div class="mt-3 flex flex-wrap gap-2">
               <button onclick="addPartyMember('Party')" type="button" 
                  class="text-white bg-gradient-to-br from-green-400 to-blue-600 hover:bg-gradient-to-bl focus:ring-4 
                  focus:outline-none focus:ring-green-200 dark:focus:ring-green-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               Party
               </button>
               <button onclick="addPartyMember('Kora')" type="button" 
                  class="text-white bg-gradient-to-r from-teal-400 via-teal-500 to-teal-600 hover:bg-gradient-to-br focus:ring-4 
                  focus:outline-none focus:ring-teal-300 dark:focus:ring-teal-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               Kora
               </button>
               <button onclick="addPartyMember('Nharavi')" type="button" 
                  class="text-white bg-gradient-to-r from-teal-400 via-teal-500 to-teal-600 hover:bg-gradient-to-br focus:ring-4 
                  focus:outline-none focus:ring-teal-300 dark:focus:ring-teal-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               Nharavi
               </button>
               <button onclick="addPartyMember('Opal')" type="button" 
                  class="text-white bg-gradient-to-r from-teal-400 via-teal-500 to-teal-600 hover:bg-gradient-to-br focus:ring-4 
                  focus:outline-none focus:ring-teal-300 dark:focus:ring-teal-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               Opal
               </button>
               <button onclick="addPartyMember('Scylla')" type="button" 
                  class="text-white bg-gradient-to-r from-teal-400 via-teal-500 to-teal-600 hover:bg-gradient-to-br focus:ring-4 
                  focus:outline-none focus:ring-teal-300 dark:focus:ring-teal-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               Scylla
               </button>
               <button onclick="addPartyMember('Zion')" type="button" 
                  class="text-white bg-gradient-to-r from-teal-400 via-teal-500 to-teal-600 hover:bg-gradient-to-br focus:ring-4 
                  focus:outline-none focus:ring-teal-300 dark:focus:ring-teal-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               Zion
               </button>
               <button onclick="addPartyMember('Zuriel')" type="button" 
                  class="text-white bg-gradient-to-r from-purple-500 via-purple-600 to-purple-700 hover:bg-gradient-to-br focus:ring-4 
                  focus:outline-none focus:ring-purple-300 dark:focus:ring-purple-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               Zuriel
               </button>
               <button onclick="addPartyMember('Ethris')" type="button" 
                  class="text-white bg-gradient-to-r from-purple-500 via-purple-600 to-purple-700 hover:bg-gradient-to-br focus:ring-4 
                  focus:outline-none focus:ring-purple-300 dark:focus:ring-purple-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               Ethris
               </button>
            </div>
            <div class="mt-3 flex flex-wrap gap-2">
               <table class="w-full text-sm mb-2" id="initiativeTable">
                  <thead class="bg-gray-900 sticky top-0">
                     <tr class="text-left border-b border-gray-600">
                        <th class="py-2 px-3 text-left text-sm font-semibold text-neutral-200">Personaje</th>
                        <th class="py-2 px-3 text-left text-sm font-semibold text-neutral-200">Iniciativa</th>
                     </tr>
                  </thead>
                  <tbody class="divide-y divide-gray-700/60 border-b border-gray-700/60">
                     <tr>
                        <td contenteditable data-placeholder="-" class="border-b border-gray-700/60 px-2 max-w-[100px] min-h-[36px] align-top whitespace-nowrap overflow-hidden truncate"></td>
                        <td contenteditable data-placeholder="-" class="border-b border-gray-700/60 px-2 max-w-[100px] min-h-[36px] align-top whitespace-nowrap overflow-hidden truncate"></td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </section>
         <!-- ========================= -->
         <!-- TRACKER PRINCIPAL -->
         <!-- ========================= -->
         <section class="bg-gray-800 p-4 rounded lg:col-span-2 overflow-x-auto">
            <div class="flex justify-between items-center mb-2">
               <h2 class="text-lg font-bold">Combat Tracker</h2>
               <button onclick="addRound()" type="button" 
                  class="text-white bg-gradient-to-r from-purple-500 via-purple-600 to-purple-700 hover:bg-gradient-to-br focus:ring-4 
                  focus:outline-none focus:ring-purple-300 dark:focus:ring-purple-800 font-medium rounded-xl text-sm px-4 py-2.5 text-center leading-5">
               Ronda 🡅
               </button>
            </div>
            <table class="w-full text-sm border-collapse table-auto" id="trackerTable">
               <thead class="bg-gray-900 sticky top-0">
                  <tr class="border-b border-gray-600">
                     <th class="py-2 px-3 text-left text-sm font-semibold text-neutral-200">Personaje</th>
                     <th class="py-2 px-3 text-left text-sm font-semibold text-neutral-200">Daño acumulado</th>
                     <th class="py-2 px-3 text-left text-sm font-semibold text-neutral-200">Ronda 1</th>
                  </tr>
               </thead>
               <tbody class="divide-y divide-gray-700/60 border-b border-gray-700/60">
                  <!-- Se llena SOLO al enviar iniciativa -->
               </tbody>
            </table>
         </section>
      </main>
      <!-- ========================= -->
      <!-- JS SIMPLE -->
      <!-- ========================= -->
      <script>
         let roundCount = 1;
         
         function addInitiativeRow() {
           const tbody = document.querySelector("#initiativeTable tbody");
           const row = document.createElement("tr");
         
           row.innerHTML = `
             <td contenteditable data-placeholder="-" class="border-b border-gray-700/60 px-2 py-1 max-w-[100px] min-h-[36px] align-top whitespace-nowrap overflow-hidden truncate"></td>
             <td contenteditable data-placeholder="-" class="border-b border-gray-700/60 px-2 py-1 max-w-[100px] min-h-[36px] align-top whitespace-nowrap overflow-hidden truncate"></td>
           `;
         
           tbody.appendChild(row);
         }
         
         function sendToTracker() {
           const rows = document.querySelectorAll("#initiativeTable tbody tr");
           const trackerBody = document.querySelector("#trackerTable tbody");
         
           trackerBody.innerHTML = "";
         
           let characters = [];
         
           rows.forEach(row => {
             const name = row.cells[0].innerText.trim();
             const init = parseInt(row.cells[1].innerText.trim());
         
             if (name && !isNaN(init)) {
               characters.push({ name, init });
             }
           });
         
           characters.sort((a, b) => b.init - a.init);
         
           characters.forEach(char => {
             const tr = document.createElement("tr");
         
             tr.innerHTML = `
               <td class="border-b border-gray-700/60 min-h-[36px] align-top px-2 py-1">${char.name}</td>
               <td class="border-b border-gray-700/60 min-h-[36px] align-top px-2 py-1 max-w-[140px]">
               <div class="flex items-center gap-1">
                 <button onclick="addDamage(this, -1)"
                   class="px-1 bg-red-700 rounded text-xs">−</button>
         
                 <button onclick="addDamage(this, 1)"
                   class="px-1 bg-green-700 rounded text-xs">+</button>
         
                 <span class="text-xs text-neutral-300 damage-display">
                   = [0]
                 </span>
               </div>
             </td>
               <td contenteditable data-placeholder="-" class="border-b border-gray-700/60 min-h-[36px] align-top px-2 py-1 max-w-[100px] whitespace-nowrap overflow-hidden truncate"></td>
             `;
         
             trackerBody.appendChild(tr);
           });
         }
         
         function addRound() {
          roundCount++;
         
          const headerRow = document.querySelector("#trackerTable thead tr");
          const th = document.createElement("th");
          th.className = "py-2 px-3 text-left text-sm font-semibold text-neutral-200";
          th.innerText = `Ronda ${roundCount}`;
          headerRow.appendChild(th);
         
          const rows = document.querySelectorAll("#trackerTable tbody tr");
          rows.forEach(row => {
            const td = document.createElement("td");
            td.contentEditable = true;
            td.dataset.placeholder = "-";
            td.className =
              "border-b border-gray-700/60 min-h-[36px] align-top px-2 py-1 max-w-[100px] whitespace-nowrap overflow-hidden truncate";
            row.appendChild(td);
          });
         }
         
      </script>
      <script>
         fetch("/components/navbar.html")
           .then(res => res.text())
           .then(html => {
             document.getElementById("navbar").innerHTML = html;
         
             const currentPath = window.location.pathname;
             const links = document.querySelectorAll("[data-nav]");
         
             links.forEach(link => {
               if (link.getAttribute("href") === currentPath) {
                 link.classList.remove("text-neutral-300");
                 link.classList.add(
                   "text-gold",
                   "font-semibold",
                   "border-b-2",
                   "border-gold",
                   "pb-1"
                 );
               }
             });
           });
      </script>
      <script>
         function addDamage(button, direction) {
           const cell = button.closest("td");
         
           if (!cell.dataset.log) {
             cell.dataset.log = "";
           }
         
           const amount = prompt(
             direction > 0 ? "¿Cuánto daño se añade?" : "¿Cuánto daño se resta?"
           );
         
           const value = parseInt(amount);
           if (isNaN(value)) return;
         
           const signedValue = direction > 0 ? value : -value;
         
           const log = cell.dataset.log
             ? cell.dataset.log.split(",").map(Number)
             : [];
         
           log.push(signedValue);
           cell.dataset.log = log.join(",");
         
           const total = log.reduce((a, b) => a + b, 0);
         
           cell.querySelector(".damage-display").innerText =
             `${log.map(v => v > 0 ? "+" + v : v).join(" ")} = [${total}]`;
         }
      </script>
      <script>
         function addSingleMember(name) {
         const tbody = document.querySelector("#initiativeTable tbody");
         
         const row = document.createElement("tr");
         row.innerHTML = `
           <td contenteditable
               class="border-b border-gray-700/60 px-2 py-1 min-h-[36px] align-top">
             ${name}
           </td>
           <td contenteditable
               data-placeholder="-"
               class="border-b border-gray-700/60 px-2 py-1 min-h-[36px] align-top">
           </td>
         `;
         
         tbody.appendChild(row);
         }
      </script>
      <script>
         function clearEmptyInitiativeRowIfNeeded() {
         const tbody = document.querySelector("#initiativeTable tbody");
         const rows = tbody.querySelectorAll("tr");
         
         if (rows.length !== 1) return;
         
         const cells = rows[0].querySelectorAll("td");
         const isEmpty = [...cells].every(td => td.innerText.trim() === "");
         
         if (isEmpty) {
         tbody.innerHTML = "";
         }
         }
      </script>
      <Script>
         function addPartyMember(name) {
         clearEmptyInitiativeRowIfNeeded();
         
         if (name === "Party") {
           const mainParty = ["Kora", "Nharavi", "Opal", "Scylla", "Zion"];
           mainParty.forEach(member => addSingleMember(member));
           return;
         }
         
         addSingleMember(name);
         }
      </Script>
      <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
   </body>
</html>
