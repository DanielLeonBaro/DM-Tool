<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DMT | Wiki</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#d4af37'
          }
        }
      }
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
</head>

<body class="bg-neutral-900 text-neutral-100 min-h-screen">

    <div id="navbar"></div>

<header class="border-b border-neutral-700 p-4 flex items-center justify-between">
  <h1 class="text-2xl font-bold text-gold">📖 DMT | Music</h1>
</header>

<script>
  fetch("/components/navbar.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navbar").innerHTML = html;

      const currentPath = window.location.pathname;
      const links = document.querySelectorAll("[data-nav]");

      links.forEach(link => {
        if (link.getAttribute("href") === currentPath) {
          link.classList.remove("text-neutral-300");
          link.classList.add(
            "text-gold",
            "font-semibold",
            "border-b-2",
            "border-gold",
            "pb-1"
          );
        }
      });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
</body>
</html>
